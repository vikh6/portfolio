<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desmos Background Site</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  .bg-frame {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    border: none;
    z-index: 0;
  }

  .navbar {
    position: fixed;
    top: 30%;
    left: 55%;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 3%;
    pointer-events: none;
  }

  .navbar a {
    pointer-events: auto;
    display: inline-block;
    text-decoration: none;
  }

  .navbar img {
    width: 12vw;
    max-width: 220px;
    min-width: 90px;
    height: auto;
    border-radius: 18%;
    box-shadow: 0 0.6vh 1.2vh rgba(0, 0, 0, 0.35);
    border: 2px solid rgba(255, 255, 255, 0.6);
    transition: transform 0.15s ease;
  }

  .navbar img:hover {
    transform: scale(1.06);
  }

  .nav-about {
    transform: translateY(0%) rotate(-4deg);
  }

  .nav-experience {
    transform: translateY(6%) rotate(3deg);
  }

  .nav-projects {
    transform: translateY(-3%) rotate(-2deg);
  }

  @media (max-width: 768px) {
    .navbar {
      top: 23%;
      left: 65%;
      transform: none;
      flex-direction: column;
      gap: 1.5rem;
    }

    .navbar img {
      width: 16vw;
      max-width: 120px;
      min-width: 60px;
    }

    .nav-about,
    .nav-experience,
    .nav-projects {
      transform: none;
    }
  }

  @media (max-width: 480px) {
    .navbar img {
      width: 18vw;
      max-width: 90px;
      min-width: 50px;
    }

    .navbar {
      gap: 1rem;
    }
  }
</style>
</head>
<body>

  <iframe
    id="bg-frame"
    class="bg-frame"
    src="https://www.desmos.com/calculator/e6c3ibzu4f?embed"
    allowfullscreen>
  </iframe>

  <nav class="navbar">
    <a href="about.html" class="nav-about">
      <img src="images/about.png" alt="About">
    </a>
    <a href="experience.html" class="nav-experience">
      <img src="images/experience.png" alt="Experience">
    </a>
    <a href="projects.html" class="nav-projects">
      <img src="images/projects.png" alt="Projects">
    </a>
  </nav>

  <script>
    function isMobileDevice() {
      return window.matchMedia("(max-width: 768px)").matches;
    }

    function setDesmosCalculator() {
      const bgFrame = document.getElementById("bg-frame");
      const desktopCalc = "https://www.desmos.com/calculator/6sgtszyeb1?embed";
      const mobileCalc = "https://www.desmos.com/calculator/y1dnfv8nqk?embed";
      
      bgFrame.src = isMobileDevice() ? mobileCalc : desktopCalc;
    }

    setDesmosCalculator();
  </script>

</body>
</html>
