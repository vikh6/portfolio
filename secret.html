<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secret Page</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  .bg-frame {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    border: none;
    z-index: 0;
  }

  .content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 6%;
    width: 100%;
    pointer-events: none;
    text-align: center;
    color: #222;
  }

  .content h1 {
    font-size: 2.4rem;
    letter-spacing: 0.05em;
    margin: 0;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    text-transform: capitalize;
  }

  .content p {
    margin-top: 0.75em;
    font-size: 1.05rem;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
  }

  /* Home button */
  #home-btn {
    position: fixed;
    width: 21vw;
    max-width: 400px;
    min-width: 220px;
    height: 12vh;
    cursor: pointer;
    z-index: 2;
    transition: left 0.04s ease-out, top 0.04s ease-out;
    user-select: none;
    -webkit-user-drag: none;
  }

  @media (max-width: 768px) {
    .bg-frame {
      display: none;
    }

    .content h1 {
      display: none;
    }

    #home-btn {
      display: none;
    }
  }
</style>
</head>
<body>

  <!-- Background graph -->
  <iframe
    class="bg-frame"
    src="https://www.desmos.com/calculator/y0alf1zd1u?embed"
    allowfullscreen>
  </iframe>

  <div class="content">
    <h1>secret page</h1>
    <p id="subtitle">use desktop, coward</p>
  </div>

  <img id="home-btn" src="images/home.png" alt="Home">

  <script>
    const isMobile = window.matchMedia("(max-width: 768px)").matches;
    if (!isMobile) {
      const btn = document.getElementById('home-btn');
      const DODGE_DISTANCE = 350;
      let lastMouseX = 0;
      let lastMouseY = 0;
      let lastMouseTime = 0;

      function clamp(val, min, max) {
        return Math.max(min, Math.min(max, val));
      }

      function placeAtStart() {
        const w = btn.offsetWidth;
        const h = btn.offsetHeight;
        const x = (window.innerWidth - w) / 2;
        const y = window.innerHeight - h - (window.innerHeight * 0.06);
        btn.style.left = x + 'px';
        btn.style.top = y + 'px';
      }

      if (btn.complete) {
        placeAtStart();
      } else {
        btn.addEventListener('load', placeAtStart);
      }
      window.addEventListener('resize', placeAtStart);

      document.addEventListener('mousemove', (e) => {
        const rect = btn.getBoundingClientRect();
        const btnCenterX = rect.left + rect.width / 2;
        const btnCenterY = rect.top + rect.height / 2;

        const dx = btnCenterX - e.clientX;
        const dy = btnCenterY - e.clientY;
        const dist = Math.sqrt(dx * dx + dy * dy);

        const now = Date.now();
        const timeDelta = Math.max(now - lastMouseTime, 16) / 1000;
        const cursorVelX = (e.clientX - lastMouseX) / timeDelta;
        const cursorVelY = (e.clientY - lastMouseY) / timeDelta;
        const predX = e.clientX + cursorVelX * 0.3;
        const predY = e.clientY + cursorVelY * 0.3;
        const predDx = btnCenterX - predX;
        const predDy = btnCenterY - predY;

        lastMouseX = e.clientX;
        lastMouseY = e.clientY;
        lastMouseTime = now;

        let angle = dist < 5 ? Math.random() * Math.PI * 2 : Math.atan2(predDy, predDx);
        angle += (Math.random() - 0.5) * 2.0;

        let newX = btnCenterX + Math.cos(angle) * DODGE_DISTANCE - rect.width / 2;
        let newY = btnCenterY + Math.sin(angle) * DODGE_DISTANCE - rect.height / 2;

        const margin = 20;
        const minX = margin;
        const maxX = window.innerWidth - rect.width - margin;
        const minY = margin;
        const maxY = window.innerHeight - rect.height - margin;

        const cornerThreshold = 120;
        const nearLeft = newX < cornerThreshold;
        const nearRight = newX > maxX - cornerThreshold;
        const nearTop = newY < cornerThreshold;
        const nearBottom = newY > maxY - cornerThreshold;

        if ((nearLeft || nearRight) && (nearTop || nearBottom)) {
          const newRegionX = nearLeft ? maxX * 0.7 : minX + (maxX - minX) * 0.3;
          const newRegionY = nearTop ? maxY * 0.7 : minY + (maxY - minY) * 0.3;
          newX = newRegionX + (Math.random() - 0.5) * 150;
          newY = newRegionY + (Math.random() - 0.5) * 150;
        }

        newX = clamp(newX, minX, maxX);
        newY = clamp(newY, minY, maxY);
        btn.style.left = newX + 'px';
        btn.style.top = newY + 'px';
      });

      btn.addEventListener('click', () => window.location.href = 'index.html');

      let spaceCount = 0;
      let lastSpaceTime = 0;

      document.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.key === ' ') {
          const now = Date.now();
          if (now - lastSpaceTime > 1200) spaceCount = 0;
          spaceCount += 1;
          lastSpaceTime = now;
          if (spaceCount >= 4) window.location.href = 'https://www.google.com';
        } else {
          spaceCount = 0;
        }
      });
    }
  </script>

</body>
</html>
